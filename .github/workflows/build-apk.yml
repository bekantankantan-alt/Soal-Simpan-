name: Build TugasKu APK from uploaded ZIP

on:
  push:
    branches: [ main, master ]
    paths:
      - 'TugasKu-Android-Project.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack uploaded Android project ZIP
        run: |
          test -f TugasKu-Android-Project.zip
          unzip -q TugasKu-Android-Project.zip -d extracted
          test -f extracted/TugasKu_Android_Project/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: extracted/TugasKu_Android_Project
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TugasKuUT-debug-apk
          path: extracted/TugasKu_Android_Project/app/build/outputs/apk/debug/app-debug.apk
