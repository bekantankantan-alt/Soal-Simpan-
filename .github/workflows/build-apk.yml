name: Build TugasKu APK from uploaded ZIP

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'TugasKu-Android-Project.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project ZIP
        run: |
          test -f TugasKu-Android-Project.zip
          unzip -q TugasKu-Android-Project.zip -d extracted
          test -f extracted/TugasKu_Android_Project/app/build.gradle

      - name: Fix Java and Kotlin JVM targets
        working-directory: extracted/TugasKu_Android_Project
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'id.tugasku.ut'
              compileSdk 35

              defaultConfig {
                  applicationId 'id.tugasku.ut'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: extracted/TugasKu_Android_Project
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TugasKuUT-debug-apk
          path: extracted/TugasKu_Android_Project/app/build/outputs/apk/debug/app-debug.apk
